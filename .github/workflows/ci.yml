name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs-on: ubuntu-latest
          - name: macos-amd64
            runs-on: macos-13
          - name: macos-arm64
            runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build native llama.cpp libraries
        run: bash ./scripts/build-llama.sh

      - name: Run tests
        env:
          CGO_ENABLED: 1
        run: go test -v ./...

      - name: Build CLI
        env:
          CGO_ENABLED: 1
        run: go build -o th .

      - name: Verify
        run: |
          ./th --version || true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runs-on: windows-latest
          - name: linux-amd64
            runs-on: ubuntu-latest
          - name: macos-arm64
            runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up MSYS2 toolchain (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake

      - name: Build native llama.cpp libraries (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: BUILD_DIR="$PWD/third_party/llama.cpp/build-mingw" CMAKE_GENERATOR="MinGW Makefiles" bash ./scripts/build-llama.sh

      - name: Build native llama.cpp libraries (Unix)
        if: runner.os != 'Windows'
        run: bash ./scripts/build-llama.sh

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: 1
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $usrBin = Join-Path $env:MSYS2_LOCATION 'usr\bin'
          $env:PATH = "$mingwBin;$usrBin;$env:PATH"
          $env:CC = Join-Path $mingwBin 'gcc.exe'
          $env:CXX = Join-Path $mingwBin 'g++.exe'
          go test -v ./...

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: 1
        run: go test -v ./...

      - name: Build CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: 1
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingwBin = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $usrBin = Join-Path $env:MSYS2_LOCATION 'usr\bin'
          $env:PATH = "$mingwBin;$usrBin;$env:PATH"
          $env:CC = Join-Path $mingwBin 'gcc.exe'
          $env:CXX = Join-Path $mingwBin 'g++.exe'
          go build -o th.exe .

      - name: Build CLI (Unix)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: 1
        run: go build -o th .

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\th.exe version

      - name: Verify (Unix)
        if: runner.os != 'Windows'
        run: |
          ./th version
